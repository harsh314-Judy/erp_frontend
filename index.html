<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        if (localStorage.getItem("erp.theme") !== "light") document.documentElement.classList.add("dark")
        var scheme = localStorage.getItem("erp.scheme")
        if (scheme === "green" || scheme === "violet") document.documentElement.dataset.scheme = scheme
      } catch (e) {
        document.documentElement.classList.add("dark")
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
